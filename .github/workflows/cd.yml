# ============================================================
# CD — Déploiement Continu
#
# Déclenché uniquement quand le workflow CI passe sur main.
# Deux étapes séquentielles :
#   1. deploy-preprod  : déploiement automatique en pré-production
#   2. deploy-prod     : déploiement en production — BLOQUÉ jusqu'à approbation humaine
#
# ⚠️  GATE PRODUCTION
# Pour activer l'approbation humaine :
#   GitHub → Settings → Environments → production → Required reviewers
#   Ajoutez les personnes autorisées à approuver le passage en prod.
# ============================================================

name: CD

on:
  workflow_run:
    # Se déclenche uniquement si le workflow "CI" a réussi sur main
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  # ----------------------------------------------------------
  # JOB 1 : Déploiement automatique en pré-production
  # Aucune approbation requise — se lance dès que le CI est vert
  # ----------------------------------------------------------
  deploy-preprod:
    name: Deploy → Pre-production
    runs-on: ubuntu-latest
    # N'exécute ce job que si le CI a réussi (pas annulé ni échoué)
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    # L'environnement "preprod" peut être créé dans Settings > Environments
    # pour tracer les déploiements dans l'UI GitHub
    environment:
      name: preprod
      url: ${{ vars.PREPROD_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Exemple de déploiement — remplacez ces étapes par votre outil réel
      # (kubectl apply, docker compose up, helm upgrade, az webapp deploy…)
      - name: Deploy to pre-production
        env:
          # Les secrets sont définis dans Settings > Secrets and variables > Actions
          PREPROD_HOST: ${{ secrets.PREPROD_HOST }}
          PREPROD_TOKEN: ${{ secrets.PREPROD_TOKEN }}
        run: |
          echo "=== Déploiement en pré-production ==="
          echo "Commit : ${{ github.event.workflow_run.head_sha }}"
          echo "Cible  : $PREPROD_HOST"
          # Remplacez la ligne ci-dessous par votre commande de déploiement réelle :
          # kubectl set image deployment/catalog catalog=ecommerce-catalog:${{ github.event.workflow_run.head_sha }}

      - name: Health check pre-production
        run: |
          echo "=== Vérification santé pré-production ==="
          # Exemple : curl --fail https://preprod.example.com/health
          echo "Health check OK"

  # ----------------------------------------------------------
  # JOB 2 : Déploiement en production — GATE MANUEL REQUIS
  #
  # Ce job attend qu'un reviewer approuve via l'UI GitHub avant de s'exécuter.
  # Sans approbation, il reste en attente (jusqu'à 30 jours par défaut).
  # ----------------------------------------------------------
  deploy-prod:
    name: Deploy → Production  [gate manuel]
    runs-on: ubuntu-latest
    needs: deploy-preprod        # attend la réussite du déploiement pré-prod

    # "environment: production" est le mécanisme clé du gate :
    # GitHub met le job en pause et attend l'approbation des "Required reviewers"
    # configurés dans Settings > Environments > production
    environment:
      name: production
      url: ${{ vars.PROD_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_TOKEN: ${{ secrets.PROD_TOKEN }}
        run: |
          echo "=== Déploiement en PRODUCTION ==="
          echo "Commit : ${{ github.event.workflow_run.head_sha }}"
          echo "Cible  : $PROD_HOST"
          # Remplacez la ligne ci-dessous par votre commande de déploiement réelle :
          # kubectl set image deployment/catalog catalog=ecommerce-catalog:${{ github.event.workflow_run.head_sha }}

      - name: Health check production
        run: |
          echo "=== Vérification santé production ==="
          # Exemple : curl --fail https://www.example.com/health
          echo "Health check OK"

      # Notification optionnelle une fois le déploiement terminé
      - name: Notify deployment success
        if: success()
        run: |
          echo "Déploiement prod réussi pour le commit ${{ github.event.workflow_run.head_sha }}"
          # Exemple Slack : curl -X POST -H 'Content-type: application/json' \
          #   --data '{"text":"✅ Prod déployé"}' ${{ secrets.SLACK_WEBHOOK_URL }}
