global:
  imagePullPolicy: Never
  aspnetcoreEnvironment: Production

catalog:
  image:
    repository: ecommerce-catalog
    tag: latest
  replicas: 1
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    cpuUtilization: 70

ordering:
  image:
    repository: ecommerce-ordering
    tag: latest
  replicas: 1
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    cpuUtilization: 70

gateway:
  image:
    repository: ecommerce-gateway
    tag: latest
  replicas: 1
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    cpuUtilization: 70

web:
  image:
    repository: ecommerce-web
    tag: latest
  replicas: 1
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    cpuUtilization: 70

ingress:
  enabled: true
  className: traefik
  host: ecommerce.localhost
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
